[daemon]
conf_dir = /etc/radio-now-playing/conf.d
state_db = /var/lib/radio-now-playing/state.sqlite3
log_level = INFO
user_agent = evan-radio-now-playing/1.0

[defaults]
connect_timeout = 5
read_timeout = 8
request_timeout = 12
retry_attempts = 3
retry_budget = 25
retry_backoff = 1
retry_jitter = 0.25
max_response_bytes = 1048576
