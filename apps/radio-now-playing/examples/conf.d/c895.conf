[station]
id = c895
enabled = true
method = html
url = http://knhc-ice.streamguys1.com/status.xsl?mount=/live
webhook_url = WEBHOOK_PLACEHOLDER_C895
poll_interval = 30
identity = {display_text}
initial_post = false

[field.display_text]
selector = td.streamdata
after_label = Current Song:
label_selector = td

[message]
layout = field
title = Now Playing
text = {display_text}
fallback = Song Change Detected
color_key = {display_text}
