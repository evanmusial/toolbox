[station]
id = slam
enabled = true
method = json
url = https://prod.radio-api.net/stations/now-playing?stationIds=slam
webhook_url = WEBHOOK_PLACEHOLDER_SLAM
poll_interval = 30
identity = {display_text}
initial_post = false

[field.display_text]
path = /0/title

[message]
layout = field
title = Now Playing
text = {display_text}
fallback = Song Change Detected
color_key = {display_text}
