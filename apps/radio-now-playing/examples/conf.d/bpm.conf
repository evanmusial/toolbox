[station]
id = bpm
enabled = true
method = json
url = https://xmplaylist.com/api/station/bpm
webhook_url = WEBHOOK_PLACEHOLDER_BPM
poll_interval = 120
identity = {play_id}
initial_post = false

[field.play_id]
path = /results/0/id

[field.title]
path = /results/0/track/title

[field.artists]
path = /results/0/track/artists
multiple = true
required = false
join = ", "

[field.image_url]
path = /results/0/spotify/albumImageSmall
required = false

[message]
layout = section
text = *{title}*
    {artists}
fallback = {title} - {artists}
color_key = {match_key}
